name: LoopX CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: 运行单元测试
        run: python -m unittest discover -s tests
      - name: 运行 LoopX kit harness
        run: python loopx/tools/loopx_check.py kit --root .
