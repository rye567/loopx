# LoopX 中立权限策略。
# 适配器负责翻译成 Codex rules 或 Claude settings。

auto_dev:
  edit_workspace_files: true
  edit_tests: true
  edit_stage_docs: true
  run_compile: true
  run_unit_tests: true
  run_targeted_maven_tests: true

allow:
  - mvn compile
  - mvn test
  - mvn -pl <module-path> -am -DskipTests compile
  - mvn -pl <module-path> -am -Dtest=<TestClass> -DfailIfNoTests=false test

ask:
  - git commit
  - git push
  - git push --force-with-lease
  - mvn clean
  - rm -rf <project-subpath>
  - rmdir /s /q <project-subpath>
  - rd /s /q <project-subpath>
  - del /s /q <project-subpath>
  - Remove-Item -Recurse -Force <project-subpath>

deny:
  - git reset --hard
  - git push --force
  - drop database
  - truncate table
  - delete from <table> without where
  - rm -rf /
  - rm -rf ~
  - rm -rf $HOME
  - rmdir /s /q C:\
  - rd /s /q C:\
  - del /s /q C:\
  - Remove-Item -Recurse -Force $env:USERPROFILE

read_deny:
  - ./.env
  - ./.env.*
